    <path d="M35,55 H150"/><path d="M150,55 V130"/><path d="M150,130 H35"/>
    <path d="M35,130 V105"/><path d="M35,80 V55"/>
  </g>
  <line x1="23" y1="95" x2="47" y2="95" stroke="#1f2430" stroke-width="1.5"/>
  <line x1="29" y1="87" x2="41" y2="87" stroke="#1f2430" stroke-width="4"/>
  <g fill="#fff" stroke="#1f2430" stroke-width="1.5"><circle cx="75" cy="55" r="11"/><circle cx="115" cy="55" r="11"/></g>
  <g stroke="#1f2430" stroke-width="1.2">
    <line x1="67" y1="47" x2="83" y2="63"/><line x1="83" y1="47" x2="67" y2="63"/>
    <line x1="107" y1="47" x2="123" y2="63"/><line x1="123" y1="47" x2="107" y2="63"/>
  </g>
  <text x="68" y="158">series</text>
