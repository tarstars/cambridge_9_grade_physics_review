  </g>
  <line x1="198" y1="95" x2="222" y2="95" stroke="#1f2430" stroke-width="1.5"/>
  <line x1="204" y1="87" x2="216" y2="87" stroke="#1f2430" stroke-width="4"/>
  <g fill="#fff" stroke="#1f2430" stroke-width="1.5"><circle cx="268" cy="90" r="11"/><circle cx="315" cy="90" r="11"/></g>
  <g stroke="#1f2430" stroke-width="1.2">
    <line x1="260" y1="82" x2="276" y2="98"/><line x1="276" y1="82" x2="260" y2="98"/>
    <line x1="307" y1="82" x2="323" y2="98"/><line x1="323" y1="82" x2="307" y2="98"/>
  </g>
